name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-policy:
    name: Docs & policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required docs present
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f docs/design-principles.md
          test -f docs/experience-profiles.md
          test -f docs/naming-and-trademarks.md
          test -f docs/profile-classic.md

      - name: Trademark scan (shippable trees)
        run: sh scripts/check-trademarks.sh

  image-build:
    name: Build bootc image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build image (skeleton)
        run: podman build -t sidos image/

  image-publish:
    name: Publish to ghcr.io (main only)
    needs: image-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build & push image
        run: |
          podman build -t ghcr.io/${{ github.repository_owner }}/sidos:latest -t ghcr.io/${{ github.repository_owner }}/sidos:${{ github.sha }} image/
          podman push ghcr.io/${{ github.repository_owner }}/sidos:latest
          podman push ghcr.io/${{ github.repository_owner }}/sidos:${{ github.sha }}

  install-media:
    # DISABLED 2026-11-11: bootc-image-builder cannot run on GitHub-hosted runners
    # (mount: /run/osbuild/containers/storage: permission denied).
    # Re-enable only on a self-hosted or privileged runner.
    name: Build ISO + qcow2 (manual)
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build bootc image from this ref
        run: sudo podman build -t localhost/sidos:ci image/
      - name: Build bootable ISO with bootc-image-builder
        run: |
          sudo mkdir -p /var/tmp/bootc-out
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/tmp/bootc-out:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --type iso --rootfs btrfs localhost/sidos:ci
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/tmp/bootc-out:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --type qcow2 --rootfs btrfs localhost/sidos:ci
          sudo chown -R $USER:$USER /var/tmp/bootc-out
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete release-v0.0.0-phase2 --yes || true
          gh release create release-v0.0.0-phase2 --prerelease \
            --title "SiD OS pre-alpha (Phase 2, untested)" \
            --notes "Auto-built from main by CI. NOT TESTED — boot at your own risk. Answers at Discussions." \
            /var/tmp/bootc-out/bootiso/disk.iso#sidos-phase2.iso \
            /var/tmp/bootc-out/qcow2/disk.qcow2#sidos-phase2.qcow2

  qemu-smoke-test:
    # DISABLED 2026-11-11: bootc-image-builder cannot run on GitHub-hosted runners
    # (mount: /run/osbuild/containers/storage: permission denied).
    # Re-enable on a self-hosted or privileged runner only.
    name: QEMU smoke test — boot to graphical login
    needs: image-build
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update && sudo apt-get install -y podman qemu-system-x86 python3-pillow
      - name: Build bootc image
        run: sudo podman build -t localhost/sidos:ci image/
      - name: Build bootable qcow2 (bootc-image-builder)
        run: |
          sudo mkdir -p /var/tmp/bootc-out
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/tmp/bootc-out:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --type qcow2 --rootfs btrfs localhost/sidos:ci
          sudo chown -R $USER:$USER /var/tmp/bootc-out
      - name: Run VM smoke test
        run: |
          python scripts/vm_gui_test.py \
            --disk /var/tmp/bootc-out/qcow2/disk.qcow2 \
            --out shots --count 6 --interval 8 --accel tcg --memory 4096 --smp 2
          # TODO: Phase 4 — add profile visual distinctness lint (Classic/Studio/Flow
          #       screenshot analysis to verify UI differences are preserved across
          #       Plasma updates and profile switches).
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smoke-test-artifacts
          path: |
            shots/*.png
            shots/serial.log
          retention-days: 7


